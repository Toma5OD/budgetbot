name: BudgetBot
options:
  bundleIdPrefix: dev.toma5od
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: NS4MWJH5LR
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
targets:
  BudgetBot:
    type: application
    platform: iOS
    sources:
      - path: BudgetBot
        excludes:
          - "**/.DS_Store"
    resources:
      - path: BudgetBot/Resources/Assets.xcassets
      - path: BudgetBot/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: ShareExtension
        embed: true
      - target: BudgetBotWidget
        embed: true
    info:
      path: BudgetBot/Resources/Info.plist
      properties:
        CFBundleDisplayName: BudgetBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: BudgetBot uses the camera to scan receipts, invoices and bills so the AI can extract the data.
        NSPhotoLibraryUsageDescription: BudgetBot reads photos you pick so the AI can extract transaction data from them.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - dev.toma5od.BudgetBot.refresh
    entitlements:
      path: BudgetBot/BudgetBot.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.dev.toma5od.BudgetBot
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)dev.toma5od.BudgetBot
        com.apple.security.application-groups:
          - group.dev.toma5od.BudgetBot
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.toma5od.BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.toma5od.BudgetBot
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BudgetBotWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BudgetBotWidget
      - path: BudgetBot/Shared
    info:
      path: BudgetBotWidget/Info.plist
      properties:
        CFBundleDisplayName: BudgetBot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BudgetBotWidget/BudgetBotWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.toma5od.BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.toma5od.BudgetBot.Widget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: BudgetBot/Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BudgetBot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.toma5od.BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.toma5od.BudgetBot.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  BudgetBotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgetBotTests
    dependencies:
      - target: BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.toma5od.BudgetBotTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BudgetBot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BudgetBot"

  BudgetBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BudgetBotUITests
    dependencies:
      - target: BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.toma5od.BudgetBotUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BudgetBot

schemes:
  BudgetBot:
    build:
      targets:
        BudgetBot: all
        ShareExtension: all
        BudgetBotWidget: all
        BudgetBotTests: [test]
        BudgetBotUITests: [test]
    test:
      targets:
        - BudgetBotTests
        - BudgetBotUITests
      gatherCoverageData: true
