name: BudgetBot
options:
  bundleIdPrefix: com.budgetbot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BudgetBot:
    type: application
    platform: iOS
    sources:
      - path: BudgetBot
        excludes:
          - "**/.DS_Store"
    resources:
      - path: BudgetBot/Resources/Assets.xcassets
    dependencies:
      - target: ShareExtension
        embed: true
    info:
      path: BudgetBot/Resources/Info.plist
      properties:
        CFBundleDisplayName: BudgetBot
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: BudgetBot uses the camera to scan receipts, invoices and bills so the AI can extract the data.
        NSPhotoLibraryUsageDescription: BudgetBot reads photos you pick so the AI can extract transaction data from them.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: BudgetBot/BudgetBot.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.budgetbot.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.budgetbot.BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetbot.BudgetBot
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: BudgetBot/Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BudgetBot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.budgetbot.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetbot.BudgetBot.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  BudgetBotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgetBotTests
    dependencies:
      - target: BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetbot.BudgetBotTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BudgetBot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BudgetBot"

  BudgetBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BudgetBotUITests
    dependencies:
      - target: BudgetBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetbot.BudgetBotUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BudgetBot

schemes:
  BudgetBot:
    build:
      targets:
        BudgetBot: all
        ShareExtension: all
        BudgetBotTests: [test]
        BudgetBotUITests: [test]
    test:
      targets:
        - BudgetBotTests
        - BudgetBotUITests
      gatherCoverageData: true
